[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-sdk"
version = "0.2.0"
description = "Sentinel SDK for Python: captures errors, measures requests and continues traces started in the browser."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []  # solo biblioteca estándar: nada que instalar ni que pueda chocar con tu app
classifiers = [
	"Programming Language :: Python :: 3",
	"Topic :: Software Development :: Debuggers",
]

[project.optional-dependencies]
dev = [
	"pytest>=8",
	"pytest-asyncio>=0.24",
	"jsonschema>=4.23",
	"requests>=2.32",
	"httpx>=0.27",
	"starlette>=0.40",
	"flask>=3.0",
	"django>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
	"error::pytest.PytestUnraisableExceptionWarning",
	"ignore:Using .httpx. with .starlette.testclient.",
]
